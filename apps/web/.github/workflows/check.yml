name: check

# Только проверка: линтер, типы, тесты. Деплоя здесь нет.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: senim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Тестовые креды одноразового контейнера CI, не секрет.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/senim_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/senim_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
