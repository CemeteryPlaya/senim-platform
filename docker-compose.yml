# Postgres для разработки (база senim) и тестов (база senim_test).
# Запуск: npm run db:up
services:
  postgres:
    image: postgres:17-alpine
    container_name: senim-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: senim
    ports:
      - "5442:5432"
    volumes:
      - senim-pg-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  senim-pg-data:
