# mesh-gateway: единственный путь синхронных вызовов между web и сервисами.
# Вход — gRPC поверх HTTP/2 с mTLS: клиентский сертификат нашего CA обязателен, и это сертификат
# web или сервиса (прочие владельцы сертификатов CA сюда не допускаются). Кто вызывает, сервис узнаёт
# из XFCC, который ставит mesh (ADR-011): к сервису mesh идёт со своим сертификатом.
# Маршрут по пакету: /senim.identity.v1.* → identity. У gRPC-health нет имени сервиса в пути —
# его маршрутизирует заголовок x-senim-target. Балансировка — по запросам (ROUND_ROBIN поверх
# HTTP/2), активная gRPC-проверка здоровья выводит реплику из ротации на время её остановки.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

# Потолок одновременных входящих соединений (без него Envoy предупреждает при старте).
overload_manager:
  resource_monitors:
    - name: envoy.resource_monitors.global_downstream_max_connections
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 10000

static_resources:
  listeners:
    - name: mesh
      address:
        socket_address: { address: 0.0.0.0, port_value: 9443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                alpn_protocols: [h2]
                tls_params:
                  tls_minimum_protocol_version: TLSv1_3
                tls_certificates:
                  - certificate_chain: { filename: /certs/mesh.pem }
                    private_key: { filename: /certs/mesh-key.pem }
                validation_context:
                  trusted_ca: { filename: /certs/ca.pem }
                  # Кто может звать сервисы через mesh: web и сами сервисы.
                  match_typed_subject_alt_names:
                    - { san_type: DNS, matcher: { exact: web } }
                    - { san_type: DNS, matcher: { exact: identity } }
                    - { san_type: DNS, matcher: { exact: deal } }
                    - { san_type: DNS, matcher: { exact: marketplace } }
                    - { san_type: DNS, matcher: { exact: documents } }
                    - { san_type: DNS, matcher: { exact: files } }
                    - { san_type: DNS, matcher: { exact: notify } }
                    - { san_type: DNS, matcher: { exact: operator } }
                    - { san_type: DNS, matcher: { exact: audit } }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mesh
                codec_type: HTTP2
                # Пределы HTTP/2 входа: окно потока 1 МиБ и соединения 4 МиБ вместо 256 МиБ по
                # умолчанию, не больше 100 одновременных вызовов на соединение.
                http2_protocol_options:
                  max_concurrent_streams: 100
                  initial_stream_window_size: 1048576
                  initial_connection_window_size: 4194304
                # Удостоверение вызывающего (ADR-011): входящий XFCC отбрасывается, Envoy пишет свой —
                # одно звено с DNS SAN (и URI) проверенного клиентского сертификата. Сервис читает XFCC
                # только от соединения с сертификатом mesh (pkg/server.Caller).
                forward_client_cert_details: SANITIZE_SET
                set_current_client_cert_details:
                  uri: true
                  dns: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                tracing:
                  random_sampling: { value: 100 }
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      service_name: mesh
                      grpc_service:
                        envoy_grpc: { cluster_name: otel }
                        timeout: 1s
                route_config:
                  name: mesh
                  virtual_hosts:
                    - name: services
                      domains: ["*"]
                      routes:
                        # Методы пакета: повтор только там, где он безопасен для любого метода
                        # (unavailable — по соглашению gRPC вызов можно повторить; connect-failure и refused-stream — запрос не
                        # отправлен или отвергнут до обработки). Повтор unavailable безопасен, только пока обработчик
                        # не отвечает Unavailable после побочного эффекта — правило в документации pkg/server.
                        # reset здесь нет: обрыв после отправки
                        # повторил бы неидемпотентный метод. Правило: неидемпотентные методы не ретраятся.
                        - match:
                            prefix: /senim.identity.v1.
                            grpc: {}
                          route:
                            cluster: identity
                            timeout: 10s
                            retry_policy:
                              retry_on: unavailable,connect-failure,refused-stream
                              num_retries: 2
                              retry_host_predicate:
                                - name: envoy.retry_host_predicates.previous_hosts
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate
                              host_selection_retry_max_attempts: 3
                        # gRPC-health только читает — повтор безопасен и при reset: реплика в конце окна
                        # остановки (NOT_SERVING → GOAWAY) закрывает соединения.
                        - match:
                            prefix: /grpc.health.v1.Health/
                            grpc: {}
                            headers:
                              - name: x-senim-target
                                string_match: { exact: identity }
                          route:
                            cluster: identity
                            timeout: 10s
                            retry_policy:
                              retry_on: unavailable,connect-failure,refused-stream,reset
                              num_retries: 2
                              retry_host_predicate:
                                - name: envoy.retry_host_predicates.previous_hosts
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate
                              host_selection_retry_max_attempts: 3
                http_filters:
                  # Потолок запроса — как у сервисов (pkg/server.MaxMessageBytes = 4 МиБ) плюс 5 байт
                  # кадра gRPC: больше — 413 от mesh, до сервиса не доходит. Фильтр буферизует запрос
                  # целиком: годится для унарных вызовов. Для потокового метода (если появится) фильтр
                  # отключают на его маршруте через typed_per_filter_config.
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 4194309
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true

  clusters:
    - name: identity
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      connect_timeout: 2s
      # Шаблон для каждого кластера сервиса: без «режима паники». По умолчанию при 50% нездоровых
      # хостов Envoy шлёт запросы на все, в том числе NOT_SERVING (останавливающиеся, неготовые).
      # С порогом 0 нездоровая реплика не получает запросов никогда; если здоровых нет — 503.
      common_lb_config:
        healthy_panic_threshold: { value: 0 }
      load_assignment:
        cluster_name: identity
        endpoints:
          - lb_endpoints:
              # Имя сервиса compose: DNS отдаёт адреса всех реплик.
              - endpoint: { address: { socket_address: { address: identity, port_value: 8443 } } }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      health_checks:
        - timeout: 1s
          interval: 2s
          no_traffic_interval: 2s
          unhealthy_threshold: 1
          healthy_threshold: 1
          grpc_health_check:
            service_name: senim.identity.v1.IdentityService
            authority: identity
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: identity
          common_tls_context:
            alpn_protocols: [h2]
            # Сервисы принимают только TLS 1.3; клиент Envoy по умолчанию ограничен 1.2.
            tls_params:
              tls_minimum_protocol_version: TLSv1_3
              tls_maximum_protocol_version: TLSv1_3
            tls_certificates:
              - certificate_chain: { filename: /certs/mesh.pem }
                private_key: { filename: /certs/mesh-key.pem }
            validation_context:
              trusted_ca: { filename: /certs/ca.pem }
              match_typed_subject_alt_names:
                - { san_type: DNS, matcher: { exact: identity } }

    # Приёмник трасс (профиль full, otel-lgtm). В профиле core имени нет в DNS — спаны отбрасываются.
    - name: otel
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      load_assignment:
        cluster_name: otel
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: otel-lgtm, port_value: 4317 } } }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
