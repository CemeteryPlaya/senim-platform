# Сгенерировано tools/natsconf (go run ./tools/natsconf). Не править руками.
# Права и учётные записи — ADR-012. Пароли — dev-заглушки из deploy/compose/dev.vars.
port: 4222
# Мониторинг (healthcheck контейнера) — только изнутри контейнера.
http: "127.0.0.1:8222"
jetstream {
  store_dir: "/data"
}
# TLS обязателен, клиент предъявляет сертификат внутреннего CA (тот же, что для gRPC).
tls {
  cert_file: "/certs/nats.pem"
  key_file: "/certs/nats-key.pem"
  ca_file: "/certs/ca.pem"
  verify: true
  timeout: 2
}
authorization {
  users: [
    {
      user: "identity"
      password: "dev-identity-nats"
      permissions: {
        publish: { allow: ["senim.identity.>", "$JS.API.STREAM.CREATE.SENIM_IDENTITY", "$JS.API.STREAM.UPDATE.SENIM_IDENTITY", "$JS.API.STREAM.INFO.SENIM_IDENTITY"] }
        subscribe: { allow: ["_INBOX_identity.>"] }
      }
    }
    {
      user: "deal"
      password: "dev-deal-nats"
      permissions: {
        publish: { allow: ["senim.deal.>", "$JS.API.STREAM.CREATE.SENIM_DEAL", "$JS.API.STREAM.UPDATE.SENIM_DEAL", "$JS.API.STREAM.INFO.SENIM_DEAL"] }
        subscribe: { allow: ["_INBOX_deal.>"] }
      }
    }
    {
      user: "marketplace"
      password: "dev-marketplace-nats"
      permissions: {
        publish: { allow: ["senim.marketplace.>", "$JS.API.STREAM.CREATE.SENIM_MARKETPLACE", "$JS.API.STREAM.UPDATE.SENIM_MARKETPLACE", "$JS.API.STREAM.INFO.SENIM_MARKETPLACE"] }
        subscribe: { allow: ["_INBOX_marketplace.>"] }
      }
    }
    {
      user: "documents"
      password: "dev-documents-nats"
      permissions: {
        publish: { allow: ["senim.documents.>", "$JS.API.STREAM.CREATE.SENIM_DOCUMENTS", "$JS.API.STREAM.UPDATE.SENIM_DOCUMENTS", "$JS.API.STREAM.INFO.SENIM_DOCUMENTS"] }
        subscribe: { allow: ["_INBOX_documents.>"] }
      }
    }
    {
      user: "files"
      password: "dev-files-nats"
      permissions: {
        publish: { allow: ["senim.files.>", "$JS.API.STREAM.CREATE.SENIM_FILES", "$JS.API.STREAM.UPDATE.SENIM_FILES", "$JS.API.STREAM.INFO.SENIM_FILES"] }
        subscribe: { allow: ["_INBOX_files.>"] }
      }
    }
    {
      user: "notify"
      password: "dev-notify-nats"
      permissions: {
        publish: { allow: ["senim.notify.>", "$JS.API.STREAM.CREATE.SENIM_NOTIFY", "$JS.API.STREAM.UPDATE.SENIM_NOTIFY", "$JS.API.STREAM.INFO.SENIM_NOTIFY"] }
        subscribe: { allow: ["_INBOX_notify.>"] }
      }
    }
    {
      user: "operator"
      password: "dev-operator-nats"
      permissions: {
        publish: { allow: ["senim.operator.>", "$JS.API.STREAM.CREATE.SENIM_OPERATOR", "$JS.API.STREAM.UPDATE.SENIM_OPERATOR", "$JS.API.STREAM.INFO.SENIM_OPERATOR"] }
        subscribe: { allow: ["_INBOX_operator.>"] }
      }
    }
    {
      user: "audit"
      password: "dev-audit-nats"
      permissions: {
        publish: { allow: ["senim.audit.>", "$JS.API.STREAM.CREATE.SENIM_AUDIT", "$JS.API.STREAM.UPDATE.SENIM_AUDIT", "$JS.API.STREAM.INFO.SENIM_AUDIT"] }
        subscribe: { allow: ["_INBOX_audit.>"] }
      }
    }
  ]
}
