syntax = "proto3";

package senim.events.v1;

import "google/protobuf/timestamp.proto";
import "senim/identity/v1/identity.proto";

// События сервиса identity (субъекты senim.identity.<событие>).

// UserRegistered — первый вход нового пользователя.
message UserRegistered {
  string user_id = 1;
  senim.identity.v1.Role role = 2;
}

// RoleGranted — пользователю выдана роль.
message RoleGranted {
  string user_id = 1;
  senim.identity.v1.Role role = 2;
}

// RoleSwitched — пользователь переключил активную роль.
message RoleSwitched {
  string user_id = 1;
  senim.identity.v1.Role from = 2;
  senim.identity.v1.Role to = 3;
}

// OtpGlobalLimitReached — достигнут общий суточный лимит отправки кодов.
message OtpGlobalLimitReached {
  int64 limit = 1;
  // Дата (сутки) достижения лимита.
  google.protobuf.Timestamp date = 2;
}

// MfaEnrolled — оператор подключил второй фактор.
message MfaEnrolled {
  string user_id = 1;
}

// MfaReset — второй фактор оператора сброшен.
message MfaReset {
  string user_id = 1;
}

// KycReviewed — оператор принял решение по проверке документов.
message KycReviewed {
  string user_id = 1;
  senim.identity.v1.KycStatus status = 2;
}

// ConsentGranted — пользователь дал согласие.
message ConsentGranted {
  string user_id = 1;
  senim.identity.v1.ConsentKind kind = 2;
  string version = 3;
  string reference_id = 4;
}

// ConsentRevocationRequested — подана заявка на отзыв согласия.
message ConsentRevocationRequested {
  string revocation_id = 1;
  string user_id = 2;
  senim.identity.v1.ConsentKind kind = 3;
  google.protobuf.Timestamp due_at = 4;
}

// ConsentRevocationResolved — заявка на отзыв согласия закрыта.
message ConsentRevocationResolved {
  string revocation_id = 1;
  string user_id = 2;
  senim.identity.v1.RevocationStatus status = 3;
}
