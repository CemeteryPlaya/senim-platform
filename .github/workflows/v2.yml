name: v2

# Только проверки: деплоя здесь нет.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking читает коммит до пуша или базовую ветку PR
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # protoc-gen-es запускается из apps/web/node_modules.
      - name: npm ci (apps/web)
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: buf lint
        run: go tool buf lint
      # База сравнения: на push — коммит до пуша (github.event.before), на PR — базовая ветка.
      # Коммиты идут прямо в main, поэтому сравнение с origin/main на push сравнило бы коммит
      # с самим собой и ничего не поймало. Новая ветка (before = нули), коммит, которого нет
      # в клоне (force-push), или база без proto/ — сравнение пропускается с сообщением.
      - name: База для buf breaking
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          ref=""
          case "$EVENT" in
            pull_request) ref="refs/remotes/origin/$BASE_REF" ;;
            push)
              if [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ]; then ref="$BEFORE"; fi ;;
          esac
          if [ -z "$ref" ]; then
            echo "Нет базы для сравнения ($EVENT, before=$BEFORE) — buf breaking пропущен."
          elif ! git cat-file -e "$ref^{commit}" 2>/dev/null; then
            echo "Коммита $ref нет в клоне — buf breaking пропущен."
            ref=""
          elif [ -z "$(git ls-tree -r --name-only "$ref" -- proto | head -n 1)" ]; then
            echo "В $ref ещё нет proto/ — buf breaking пропущен."
            ref=""
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: buf breaking
        if: steps.base.outputs.ref != ''
        env:
          REF: ${{ steps.base.outputs.ref }}
        run: go tool buf breaking --against ".git#ref=$REF"
      - name: Сгенерированный код актуален
        run: |
          go tool buf generate
          go tool buf generate --template buf.gen.thirdparty.yaml
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all -- gen apps/web/src/gen)"
      # Каждый sqlc-конфиг в репозитории (сейчас services/identity): пути в нём — от папки конфига.
      - name: Код sqlc актуален
        run: |
          configs="$(git ls-files '*sqlc.yaml' '*sqlc.yml' '*sqlc.json')"
          test -n "$configs"
          for f in $configs; do go tool sqlc generate -f "$f"; done
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all -- services)"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go tool golangci-lint run ./...
      # testcontainers используют Docker раннера.
      - run: go test -race ./...
      - run: go tool govulncheck ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: senim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Тестовые креды одноразового контейнера CI, не секрет.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/senim_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/senim_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            dockerfile: services/identity/Dockerfile
            target: ""
          - name: web
            dockerfile: apps/web/Dockerfile
            target: runner
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: senim/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: senim/${{ matrix.name }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: true
      - name: Уязвимости (падаем на critical)
        uses: anchore/scan-action@v6
        with:
          image: senim/${{ matrix.name }}:ci
          fail-build: true
          severity-cutoff: critical

  smoke:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Профиль core; MinIO (профиль storage) в CI не поднимается.
      - run: npm run v2:certs
      - run: npm run v2:up
      - run: npm run v2:smoke
      - name: Логи compose при падении
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml --env-file deploy/compose/dev.vars --profile core --profile full --profile storage logs --no-color --tail=300
      - name: Остановка стенда
        if: always()
        run: npm run v2:down
